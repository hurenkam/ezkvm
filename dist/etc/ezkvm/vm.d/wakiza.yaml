metadata:
  schema_version: 1.0.0
  vm_name: wakiza

resources:
  - { id: "lan", network: { bridge: "br0" } }
  - { id: "sda", storage: { block_device: "/dev/vm0/vm-108-disk0", format: "raw" } }
  - { id: "efi", storage: { block_device: "/dev/vm0/vm-108-disk1", format: "raw" } }

virtual_machine:
  machine:
    family: pc
    chipset: q35
  cpu:
    model: Host
    cores: 8
    threads: 2
    sockets: 1
  memory:
    size: 16384
  boot:
    secure: true
    uefi: { resource: "efi" }
  devices:
    - sata: { bus: 0, address: 0, type: ssd, resource: "sda" }
    - pcie: { bus: 0, device: 1, function: 2, type: virtio_net, resource: "lan" }
