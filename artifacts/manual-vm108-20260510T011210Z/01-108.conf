#Hardware%3A
#- AMD RX 7700S GPU
#
#Software
#- Windows 11 Pro
#- Steam
#- Civ 6
#- Looking Glass host application
#
#Settings
#- local admin account for Mark Hurenkamp
#- looking glass%3A map anything bigger than 1920x1200 to half size
#cpu%3A custom-7940HS-nested-vm
agent: 1
args: -spice port=5903,addr=0.0.0.0,disable-ticketing=on -device virtio-serial-pci -chardev spicevmc,id=vdagent,name=vdagent -device virtserialport,chardev=vdagent,name=com.redhat.spice.0 -device virtio-mouse -device virtio-keyboard -device ivshmem-plain,memdev=ivshmem0,bus=pcie.0 -object memory-backend-file,id=ivshmem0,share=on,mem-path=/dev/kvmfr0,size=128M
audio0: device=ich9-intel-hda,driver=spice
bios: ovmf
boot: order=scsi0;ide2;net0
cores: 8
cpu: host
efidisk0: vm1-pool:vm-108-efidisk,efitype=4m,ms-cert=2023,pre-enrolled-keys=1,size=4M
hostpci0: 0000:03:00,pcie=1,x-vga=1
ide2: none,media=cdrom
machine: pc-q35-8.1
memory: 16384
meta: creation-qemu=8.1.5,ctime=1713817056
name: wakiza
net0: virtio=BC:24:11:3A:21:B7,bridge=br0,firewall=1
numa: 0
ostype: win11
parent: intermediate_20251018
scsi0: vm1-pool:vm-108-boot,discard=on,size=256G,ssd=1
scsi1: vm1-pool:vm-108-tmp,discard=on,size=32G,ssd=1
scsihw: pvscsi
smbios1: uuid=04d064c3-66a1-4aa7-9589-f8b3ecf91cd7
sockets: 1
tablet: 0
tpmstate0: vm1-pool:vm-108-tpmstate,size=4M,version=v2.0
usb0: host=1-2.2
vga: none
vmgenid: c13b46f3-9743-49f0-92e8-297b9feac497

