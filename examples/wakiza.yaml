# Windows 11 VM configuration based on Proxmox VM 108
# This config replicates the key components of a Proxmox Windows 11 VM
# Note: Some advanced Proxmox-specific features may not be fully supported in ezkvm
name: "wakiza"
backend: "qemu"

system:
  architecture: "x86_64"
  machine: "pc-q35-8.1"
  memory: 16384          # 16 GiB
  vcpus: 8
  cpu_model: "host"
  cpu_features:
    - name: "+hv_ipi"
    - name: "+hv_relaxed"
    - name: "+hv_reset"
    - name: "+hv_runtime"
    - name: "+hv_spinlocks=0x1fff"
    - name: "+hv_stimer"
    - name: "+hv_synic"
    - name: "+hv_time"
    - name: "+hv_vapic"
    - name: "+hv_vendor_id=ezkvm"
    - name: "+hv_vpindex"
    - name: "+kvm_pv_eoi"
    - name: "+kvm_pv_unhalt"

boot:
  firmware: "uefi"
  boot_order: ["disk", "cdrom", "network"]
  uefi_code: "/usr/share/pve-edk2-firmware/OVMF_CODE_4M.secboot.fd"
  uefi_vars: "/dev/vm1/vm-108-efidisk"
  secure_boot: true

devices:
  drives:
    - id: "boot"
      path: "/dev/vm1/vm-108-boot"
      interface: "scsi"
      type: "disk"
      format: "raw"
      readonly: false
      discard: true
      controller: "scsihw0"

    - id: "tmp"
      path: "/dev/vm1/vm-108-tmp"
      interface: "scsi"
      type: "disk"
      format: "raw"
      readonly: false
      discard: true
      controller: "scsihw0"

    - id: "cdrom"
      path: ""  # Empty for CDROM
      interface: "ide"
      type: "cdrom"
      format: "raw"
      readonly: true

  networks:
    - id: "net0"
      model: "virtio-net"
      mode: "tap,ifname=tap108i0,script=/usr/libexec/qemu-server/pve-bridge,downscript=/usr/libexec/qemu-server/pve-bridgedown,vhost=on"
      mac: "BC:24:11:3A:21:B7"

  displays:
    - type: "none"  # Headless

  serials:
    - type: "pty"
      port: 0

# TPM configuration
tpm:
  version: "2.0"
  backend: "emulator"
  model: "tpm-tis"

# Guest agent
guest_agent:
  enabled: true
  socket_path: "/var/run/qemu-server/108.qga"

# Memory ballooning
ballooning:
  enabled: true
  free_page_reporting: true
  model: "virtio-balloon-pci"

# Hardware passthrough for GPU
hostpci:
  - device: "0000:03:00.0"
    id: "hostpci0.0"
    pcie: true
    x_vga: true
  - device: "0000:03:00.1"
    id: "hostpci0.1"
    pcie: true

# USB devices
# usb_devices:
#   - id: "usb0"
#     host: "1-2"
#     bus: "xhci.0"
#     port: "1"

# SCSI controllers
scsi_controllers:
  - id: "scsihw0"
    type: "pvscsi"

# SPICE display server
# spice:
#   enabled: true
#   port: 5903
#   addr: "0.0.0.0"
#   disable_ticketing: true
#   audio: true
#   vdagent: true

# Looking Glass shared memory
# ivshmem:
#   enabled: true
#   size: 128
#   vectors: 1
#   id: "ivshmem0"

# SMBIOS system information
smbios:
  uuid: "04d064c3-66a1-4aa7-9589-f8b3ecf91cd7"
  vm_generation_id: "c13b46f3-9743-49f0-92e8-297b9feac497"

# QMP monitoring
qmp:
  enabled: true
  socket_path: "/var/run/qemu-server/108.qmp"

options:
  enable_kvm: true
  daemonize: true