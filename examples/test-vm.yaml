name: "test-vm"
backend: "qemu"

system:
  architecture: "x86_64"
  machine: "q35"
  memory: 512          # Small memory for testing
  vcpus: 1
  cpu_model: "host"

boot:
  firmware: "bios"     # Use BIOS instead of UEFI for simplicity
  boot_order: ["cdrom"]

devices:
  # No drives needed for basic test

  networks:
    - id: "net0"
      model: "virtio-net"
      mode: "user"
      mac: "52:54:00:12:34:56"

  displays:
    - type: "virtio-gpu"
      vram: 64

options:
  enable_kvm: true
  daemonize: false