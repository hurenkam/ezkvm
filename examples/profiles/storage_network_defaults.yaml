policies:
  drives:
    - match:
        interface: "scsi"
        type: "disk"
      defaults:
        format: "raw"
        discard: true
        cache: "none"
        aio: "io_uring"
        detect_zeroes: "unmap"
        controller: "scsihw0"
    - match:
        interface: "ide"
        type: "cdrom"
      defaults:
        format: "raw"
        readonly: true
        aio: "io_uring"
        bus: "ide.1"

  networks:
    - match:
        backend_type: "tap"
      defaults:
        model: "virtio-net-pci"
        rx_queue_size: 1024
        tx_queue_size: 256
