system:
  architecture: "x86_64"
  machine: "pc-q35-8.1+pve0"
  cpu:
    model: "host"
    features:
      - "hv_ipi"
      - "hv_relaxed"
      - "hv_reset"
      - "hv_runtime"
      - "hv_spinlocks=0x1fff"
      - "hv_stimer"
      - "hv_synic"
      - "hv_time"
      - "hv_vapic"
      - "hv_vendor_id=proxmox"
      - "hv_vpindex"
      - "kvm=off"
      - "+kvm_pv_eoi"
      - "+kvm_pv_unhalt"
  boot:
    firmware: "uefi"
    uefi_code: "/usr/share/pve-edk2-firmware/OVMF_CODE_4M.secboot.fd"
    uefi_vars_size: 540672
    boot_order: []
    menu: true
    strict: true
    reboot_timeout: 1000
    splash: "/usr/share/qemu-server/bootsplash.jpg"
    secure_boot: true
  tpm:
    version: "2.0"
    backend: "emulator"
    model: "tpm-tis"

options:
  enable_kvm: true
  daemonize: true
  nodefaults: true
  global_options:
    - "kvm-pit.lost_tick_policy=discard"
  rtc:
    base: "localtime"
    driftfix: "slew"

