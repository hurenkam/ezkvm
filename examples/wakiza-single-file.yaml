# Windows 11 VM configuration based on Proxmox VM 108
# This config replicates the key components of a Proxmox Windows 11 VM
# Note: Some advanced Proxmox-specific features may not be fully supported in ezkvm
name: "wakiza"
backend: "qemu"

system:
  architecture: "x86_64"
  machine: "pc-q35-8.1+pve0"
  machine_options:
    - "hpet=off"
  readconfig:
    - "/usr/share/qemu-server/pve-q35-4.0.cfg"
  memory:
    size: 16384          # 16 GiB
    ballooning:
      enabled: true
      free_page_reporting: true
      model: "virtio-balloon-pci"
      id: "balloon0"
      bus: "pci.0"
      addr: "0x3"
    ivshmem:
      enabled: true
      size: 128
      vectors: 1
      id: "ivshmem0"
      bus: "pcie.0"
      mem_path: "/dev/kvmfr0"
  cpu:
    vcpus: 8
    model: "host"
    features:
      - "hv_ipi"
      - "hv_relaxed"
      - "hv_reset"
      - "hv_runtime"
      - "hv_spinlocks=0x1fff"
      - "hv_stimer"
      - "hv_synic"
      - "hv_time"
      - "hv_vapic"
      - "hv_vendor_id=proxmox"
      - "hv_vpindex"
      - "kvm=off"
      - "+kvm_pv_eoi"
      - "+kvm_pv_unhalt"
  boot:
    firmware: "uefi"
    boot_order: []
    menu: true
    strict: true
    reboot_timeout: 1000
    splash: "/usr/share/qemu-server/bootsplash.jpg"
    uefi_code: "/usr/share/pve-edk2-firmware/OVMF_CODE_4M.secboot.fd"
    uefi_vars: "/dev/vm1/vm-108-efidisk"
    uefi_vars_size: 540672
    #uefi_vars: "/tmp/wakiza_vars_test.fd"
    secure_boot: true
  tpm:
    version: "2.0"
    backend: "emulator"
    model: "tpm-tis"
    state_path: "/var/run/qemu-server/108.swtpm"
    state_backend_uri: "file:///dev/vm1/vm-108-tpmstate"
    # state_dir: "/mnt/tpmstate"  # optional fallback
  smbios:
    uuid: "04d064c3-66a1-4aa7-9589-f8b3ecf91cd7"
    vm_generation_id: "c13b46f3-9743-49f0-92e8-297b9feac497"

policies:
  drives:
    - match:
        interface: "scsi"
        type: "disk"
      defaults:
        format: "raw"
        discard: true
        cache: "none"
        aio: "io_uring"
        detect_zeroes: "unmap"
        controller: "scsihw0"
      placement:
        scsi_id:
          scope: "controller"
          start: 0
          step: 1
    - match:
        interface: "ide"
        type: "cdrom"
      defaults:
        format: "raw"
        readonly: true
        aio: "io_uring"
        bus: "ide.1"
        unit: 0

  networks:
    - match:
        backend_type: "tap"
      defaults:
        model: "virtio-net-pci"
        rx_queue_size: 1024
        tx_queue_size: 256
        bus: "pci.0"
        backend:
          script: "/usr/libexec/qemu-server/pve-bridge"
          downscript: "/usr/libexec/qemu-server/pve-bridgedown"
          vhost: true
      placement:
        addr:
          scope: "bus"
          bus: "pci.0"
          start: "0x12"
          step: 1

devices:
  drives:
    - id: "scsi0"
      path: "/dev/vm1/vm-108-boot"
      interface: "scsi"
      type: "disk"
      boot_index: 100

    - id: "scsi1"
      path: "/dev/vm1/vm-108-tmp"
      interface: "scsi"
      type: "disk"

    - id: "ide2"
      path: ""  # Empty for CDROM
      interface: "ide"
      type: "cdrom"
      boot_index: 101

  networks:
    - id: "net0"
      backend:
        type: "tap"
        ifname: "tap108i0"
      mac: "BC:24:11:3A:21:B7"
      boot_index: 102

  displays: []

  serials:
    - type: "pty"
      port: 0
  input:
    - type: "virtio-mouse"
    - type: "virtio-keyboard"
  audio:
    - type: "ich9-intel-hda"
      id: "audiodev0"
      bus: "pci.2"
      addr: "0xc"
    - type: "hda-micro"
      id: "audiodev0-codec0"
      bus: "audiodev0.0"
      cad: 0
      audiodev: "spice-backend0"
    - type: "hda-duplex"
      id: "audiodev0-codec1"
      bus: "audiodev0.0"
      cad: 1
      audiodev: "spice-backend0"

host:
  pci:
    - device: "0000:03:00.0"
      id: "hostpci0.0"
      pcie: true
      bus: "ich9-pcie-port-1"
      addr: "0x0.0"
      multifunction: true
    - device: "0000:03:00.1"
      id: "hostpci0.1"
      pcie: true
      bus: "ich9-pcie-port-1"
      addr: "0x0.1"
  usb:
    - id: "usb0"
      hostbus: "1"
      hostport: "2.2"
      bus: "xhci.0"
      port: "1"

controllers:
  xhci:
    - id: "xhci"
      p2: 15
      p3: 15
      bus: "pci.1"
      addr: "0x1b"
  scsi:
    - id: "scsihw0"
      type: "pvscsi"
      bus: "pci.0"
      addr: "0x5"

# SPICE display server
spice:
  enabled: true
  port: 5903
  addr: "0.0.0.0"
  disable_ticketing: true
  audio: true
  vdagent: true

options:
  enable_kvm: true
  daemonize: true
  nodefaults: true
  guest_agent:
    enabled: true
    socket_path: "/var/run/qemu-server/108.qga"
    bus: "pci.0"
    addr: "0x8"
  qmp:
    enabled: true
    socket_path: "/var/run/qemu-server/108.qmp"
  pid_file: "/tmp/ezkvm/wakiza.pid"
  log_dir: "/tmp/ezkvm/logs"
  log_keep: 5
  global_options:
    - "kvm-pit.lost_tick_policy=discard"
  rtc:
    base: "localtime"
    driftfix: "slew"

  