# Portable ezkvm-q35.cfg for Q35 topology.
#
# Provides:
# - dedicated PCIe root ports for passthrough/root-port fanout (slots 0x1c.0-0x1c.7)
# - ICH9 USB 2.0 controllers (EHCI at 0x1d.7 + UHCI companions at 0x1d.0-0x1d.2)
# - legacy PCI islands (pci.0..pci.3) matching pve-q35-4.0.cfg layout
#
# Address layout mirrors real Q35/ICH9 silicon:
#   0x1c.0-0x1c.7  PCIe root ports ich9-pcie-port-1..8
#   0x1d.0-0x1d.2  ICH9 USB UHCI companion controllers (USB 1.1)
#   0x1d.7         ICH9 USB EHCI controller (USB 2.0, creates ehci.0 bus)
#   0x1e           ICH9 DMI-to-PCI bridge (creates legacy pci.0..pci.3)
#
# IMPORTANT: The number of [device "ich9-pcie-port-*"] entries defined here must
# match the MAX_PORTABLE_ROOT_PORTS constant in
# src/import/proxmox/mapper/topology.rs. Both are currently 8.
# When adding or removing root ports here, update that constant accordingly.

[device "ich9-pcie-port-1"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.0"
port = "1"
chassis = "1"

[device "ich9-pcie-port-2"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.1"
port = "2"
chassis = "2"

[device "ich9-pcie-port-3"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.2"
port = "3"
chassis = "3"

[device "ich9-pcie-port-4"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.3"
port = "4"
chassis = "4"

[device "ich9-pcie-port-5"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.4"
port = "5"
chassis = "5"

[device "ich9-pcie-port-6"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.5"
port = "6"
chassis = "6"

[device "ich9-pcie-port-7"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.6"
port = "7"
chassis = "7"

[device "ich9-pcie-port-8"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.7"
port = "8"
chassis = "8"

# ICH9 USB 2.0 controllers matching pve-q35-4.0.cfg.
# ehci at 1d.7 creates ehci.0 bus (USB 2.0 high-speed).
# uhci companions at 1d.0/1/2 handle USB 1.1 full/low-speed ports.
# multifunction = "on" declared on function 0 (uhci1) for the shared 0x1d slot.
[device "uhci1"]
driver = "ich9-usb-uhci1"
bus = "pcie.0"
addr = "1d.0"
multifunction = "on"
masterbus = "ehci.0"
firstport = "0"

[device "uhci2"]
driver = "ich9-usb-uhci2"
bus = "pcie.0"
addr = "1d.1"
masterbus = "ehci.0"
firstport = "2"

[device "uhci3"]
driver = "ich9-usb-uhci3"
bus = "pcie.0"
addr = "1d.2"
masterbus = "ehci.0"
firstport = "4"

[device "ehci"]
driver = "ich9-usb-ehci1"
bus = "pcie.0"
addr = "1d.7"

# Legacy PCI islands using ICH9 built-in DMI-to-PCI bridge (i82801b11-bridge),
# matching the pve-q35-4.0.cfg pattern exactly.
# i82801b11-bridge lives at addr 0x1e on pcie.0 (real Q35 silicon location).
# Each pci-bridge beneath it creates one legacy PCI bus (pci.0..pci.3).
[device "ich9-pci-bridge"]
driver = "i82801b11-bridge"
bus = "pcie.0"
addr = "0x1e"

[device "pci.0"]
driver = "pci-bridge"
bus = "ich9-pci-bridge"
addr = "0x1"
chassisno = "0"

[device "pci.1"]
driver = "pci-bridge"
bus = "ich9-pci-bridge"
addr = "0x2"
chassisno = "1"

[device "pci.2"]
driver = "pci-bridge"
bus = "ich9-pci-bridge"
addr = "0x3"
chassisno = "2"

[device "pci.3"]
driver = "pci-bridge"
bus = "ich9-pci-bridge"
addr = "0x4"
chassisno = "3"
