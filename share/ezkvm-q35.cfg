# Minimal ezkvm-q35.cfg for portable Q35 topology.
# Only includes root port definitions for portable mode.
#
# IMPORTANT: The number of [device "ich9-pcie-port-*"] entries defined here must
# match the MAX_PORTABLE_ROOT_PORTS constant in
# src/import/proxmox/mapper/topology.rs. Both are currently 4.
# When adding or removing root ports here, update that constant accordingly.

[device "ich9-pcie-port-1"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.0"
port = "1"
chassis = "1"

[device "ich9-pcie-port-2"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.1"
port = "2"
chassis = "2"

[device "ich9-pcie-port-3"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.2"
port = "3"
chassis = "3"

[device "ich9-pcie-port-4"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.3"
port = "4"
chassis = "4"
