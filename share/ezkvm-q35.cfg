# Portable ezkvm-q35.cfg for Q35 topology.
#
# Provides:
# - dedicated PCIe root ports for passthrough/root-port fanout (slots 0x1c.0-0x1c.3)
# - ICH9 USB 2.0 controllers (EHCI at 0x1d.7 + UHCI companions at 0x1d.0-0x1d.2)
# - legacy PCI islands (pci.0..pci.3) matching pve-q35-4.0.cfg layout
#
# Address layout mirrors real Q35/ICH9 silicon:
#   0x1c.0-0x1c.3  PCIe root ports ich9-pcie-port-1..4
#   0x1a.0-0x1a.2  ICH9 USB UHCI companion controllers (second USB complex)
#   0x1a.7         ICH9 USB EHCI controller (second USB complex)
#   0x1d.0-0x1d.2  ICH9 USB UHCI companion controllers (USB 1.1)
#   0x1d.7         ICH9 USB EHCI controller (USB 2.0, creates ehci.0 bus)
#   0x1b.0         Proxmox compatibility audio0 stub (ich9-intel-hda)
#   0x1e           ICH9 DMI-to-PCI bridge (creates legacy pci.0..pci.3)
#
# IMPORTANT: The number of [device "ich9-pcie-port-*"] entries defined here must
# match the MAX_PORTABLE_ROOT_PORTS constant in
# src/import/proxmox/mapper/topology.rs. Both are currently 4.
# When adding or removing root ports here, update that constant accordingly.

[device "ich9-pcie-port-1"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.0"
port = "1"
chassis = "1"

[device "ich9-pcie-port-2"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.1"
port = "2"
chassis = "2"

[device "ich9-pcie-port-3"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.2"
port = "3"
chassis = "3"

[device "ich9-pcie-port-4"]
driver = "pcie-root-port"
x-speed = "16"
x-width = "32"
multifunction = "on"
bus = "pcie.0"
addr = "1c.3"
port = "4"
chassis = "4"

# ICH9 USB 2.0 controller set #1 (matches pve-q35-4.0.cfg).
[device "ehci"]
driver = "ich9-usb-ehci1"
multifunction = "on"
bus = "pcie.0"
addr = "1d.7"

[device "uhci1"]
driver = "ich9-usb-uhci1"
multifunction = "on"
bus = "pcie.0"
addr = "1d.0"
masterbus = "ehci.0"
firstport = "0"

[device "uhci2"]
driver = "ich9-usb-uhci2"
multifunction = "on"
bus = "pcie.0"
addr = "1d.1"
masterbus = "ehci.0"
firstport = "2"

[device "uhci3"]
driver = "ich9-usb-uhci3"
multifunction = "on"
bus = "pcie.0"
addr = "1d.2"
masterbus = "ehci.0"
firstport = "4"

# ICH9 USB 2.0 controller set #2 (matches pve-q35-4.0.cfg).
[device "ehci-2"]
driver = "ich9-usb-ehci2"
multifunction = "on"
bus = "pcie.0"
addr = "1a.7"

[device "uhci-4"]
driver = "ich9-usb-uhci4"
multifunction = "on"
bus = "pcie.0"
addr = "1a.0"
masterbus = "ehci-2.0"
firstport = "0"

[device "uhci-5"]
driver = "ich9-usb-uhci5"
multifunction = "on"
bus = "pcie.0"
addr = "1a.1"
masterbus = "ehci-2.0"
firstport = "2"

[device "uhci-6"]
driver = "ich9-usb-uhci6"
multifunction = "on"
bus = "pcie.0"
addr = "1a.2"
masterbus = "ehci-2.0"
firstport = "4"

# Proxmox compatibility stub from pve-q35-4.0.cfg.
[device "audio0"]
driver = "ich9-intel-hda"
bus = "pcie.0"
addr = "1b.0"

# Legacy PCI islands using ICH9 built-in DMI-to-PCI bridge (i82801b11-bridge),
# matching the pve-q35-4.0.cfg pattern exactly.
# i82801b11-bridge lives at addr 0x1e on pcie.0 (real Q35 silicon location).
# Each pci-bridge beneath it creates one legacy PCI bus (pci.0..pci.3).
[device "pcidmi"]
driver = "i82801b11-bridge"
bus = "pcie.0"
addr = "1e.0"

[device "pci.0"]
driver = "pci-bridge"
bus = "pcidmi"
addr = "1.0"
chassis_nr = "1"

[device "pci.1"]
driver = "pci-bridge"
bus = "pcidmi"
addr = "2.0"
chassis_nr = "2"

[device "pci.2"]
driver = "pci-bridge"
bus = "pcidmi"
addr = "3.0"
chassis_nr = "3"

[device "pci.3"]
driver = "pci-bridge"
bus = "pcidmi"
addr = "4.0"
chassis_nr = "4"
