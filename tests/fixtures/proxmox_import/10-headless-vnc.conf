name: fixture-headless-vnc
ostype: l26
bios: ovmf
machine: q35
memory: 4096
cores: 4
agent: 1
vga: none
args: -vnc unix:/var/run/qemu-server/405.vnc,password=on
scsihw: virtio-scsi-pci
scsi0: /var/lib/vm/scsi0.raw,format=raw,discard=on,size=64G
sata0: /var/lib/vm/sata0.raw,format=raw,discard=on,size=32G
net0: virtio=52:54:00:12:34:56,bridge=vmbr0
