dir: local
	path /var/lib/vz
	content iso,vztmpl

lvm: boot
    vgname boot
    content images,rootdir

lvmthin: ws0
	thinpool pool
	vgname ws0
	content rootdir,images

lvmthin: vm0
	thinpool pool
	vgname vm0
	content images,rootdir

dir: bak
	path /backup
	content backup,iso,rootdir,images
	shared 0

