#Linux Mint Debian Edition
# - installed vim, net-tools, openssh-server & openconnect
# - allow root login over ssh using password
# - added users hurenkam, ibrahimc and hurenkad
# - boot console & login screen @ 1080p
#
#Contains minpve project in ~hurenkam/Workspace, an attempt at using yaml config files as an alternate to proxmox/libvirt based vm configurations
agent: 1
balloon: 0
bios: ovmf
boot: order=ide2;scsi0;net0
cores: 8
cpu: EPYC
efidisk0: vm1-pool:vm-508-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
hugepages: 1024
ide2: none,media=cdrom
machine: q35
memory: 8192
meta: creation-qemu=6.1.0,ctime=1678557947
name: elphrona
net0: virtio=26:AF:65:18:97:EF,bridge=vmbr0,firewall=1
numa: 1
ostype: l26
scsi0: vm1-pool:vm-508-disk-1,discard=on,size=64G,ssd=1
scsihw: virtio-scsi-pci
serial0: socket
smbios1: uuid=ea0fe8ee-c56f-4d4a-8059-51027c1d7a77
sockets: 1
vga: qxl2,memory=64
vmgenid: 2a5b9b82-00f1-4a6c-bcc0-bd1f89084e5f
