args: -spice port=5903,addr=0.0.0.0,disable-ticketing=on -device virtio-serial-pci -chardev spicevmc,id=vdagent,name=vdagent -device virtserialport,chardev=vdagent,name=com.redhat.spice.0 -device virtio-mouse -device virtio-keyboard -device ivshmem-plain,memdev=ivshmem43,bus=pcie.0 -object memory-backend-file,id=ivshmem43,share=on,mem-path=/dev/shm/lg43,size=32M
audio0: device=ich9-intel-hda,driver=spice
