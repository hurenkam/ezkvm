#Windows 11 Gaming
#(last updated%3A okt 5th, 2025)
#
#USB%3A 08%3A00.0 / GPU%3A 43%3A00.x / ETH%3A 0e%3A10.6
#
#
#
#args%3A -cpu host,enforce,hv_ipi,hv_relaxed,hv_reset,hv_runtime,hv_spinlocks=0x1fff,hv_stimer,hv_synic,hv_time,hv_vapic,hv_vendor_id=proxmox,hv_vpindex,kvm=off,+kvm_pv_eoi,+kvm_pv_unhalt,+lahf_lm,+sep,-hypervisor -spice port=5903,addr=0.0.0.0,disable-ticketing=on -device virtio-serial-pci -chardev spicevmc,id=vdagent,name=vdagent -device virtserialport,chardev=vdagent,name=com.redhat.spice.0 -device virtio-mouse -device virtio-keyboard -device ivshmem-plain,memdev=ivshmem,bus=pcie.0 -object memory-backend-file,id=ivshmem,share=on,mem-path=/dev/shm/looking-glass-wobani,size=128M
