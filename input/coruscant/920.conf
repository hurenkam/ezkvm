#Gentoo Linux
#- boots using systemd
#- runs ssh
#
#but not much more
agent: 1
bios: ovmf
boot: order=scsi0;ide2;net0
cores: 24
cpu: x86-64-v2-AES
efidisk0: vm1-pool:base-920-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
hugepages: 1024
ide2: none,media=cdrom
machine: q35
memory: 65536
meta: creation-qemu=8.0.2,ctime=1701388403
name: geonosis
net0: virtio=06:BE:EC:AD:5C:F7,bridge=vmbr0,firewall=1
numa: 1
numa0: cpus=0-11,hostnodes=0,memory=16384,policy=preferred
numa1: cpus=12-23,hostnodes=2,memory=49152,policy=preferred
ostype: l26
scsi0: vm1-pool:base-920-disk-1,cache=writeback,discard=on,iothread=1,size=128G,ssd=1
scsihw: virtio-scsi-single
smbios1: uuid=f635607a-d4ce-4eae-a278-074f591e549b
sockets: 1
template: 1
vga: qxl
vmgenid: 75e4c285-ff52-4898-9350-30193a3269b0
