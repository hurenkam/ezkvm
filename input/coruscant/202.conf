#Container host (Debian 11)
#
#SATA%3A 01%3A00.1 / USB%3A 45%3A00.3 / ETH%3A 0e%3A11.6
#
#As Coruscant is the VM host, so is Bakura the container host. Every main service that can run in a podman container runs on Bakura.
#
#
#Available Services%3A
#* nginx reverse proxy
#* mariadb
#* mediawiki
#* nextcloud
#* node-red
#* plex media
#* jenkins
#* git
#hostpci2%3A 0000%3A45%3A00.3,pcie=1,rombar=0
agent: 1
boot: order=scsi0;ide2
cores: 8
hostpci0: 0000:0e:11.6,pcie=1,rombar=0
hostpci1: 0000:01:00.1,pcie=1,rombar=0
hugepages: 1024
ide2: none,media=cdrom
machine: q35
memory: 16384
meta: creation-qemu=6.1.0,ctime=1672258959
name: bakura
numa: 1
ostype: l26
scsi0: vm0:vm-202-disk-0,cache=writeback,discard=on,size=32G,ssd=1
scsihw: virtio-scsi-pci
serial0: socket
smbios1: uuid=a4bdff71-ce5b-488f-b623-1a12d3ca2807
sockets: 1
unused0: ws0-pool:vm-202-disk-1
vga: qxl,memory=64
vmgenid: 11f8ae71-1587-4ede-96e6-0faf502f1392
