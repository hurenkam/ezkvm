#Ubuntu Jammy Jellyfish (22.04)
#
#Gaming configuration%3A
#- USB%3A 08%3A00.0 / GPU%3A 43%3A00.x / ETH%3A 0e%3A10.4
#- NVidia Proprietary driver 515
#  - gdm login works with signal on left screen
#  - hdmi@left only works at 4K@30Hz
#  - audio fixed
#- Firefox + DRM
#  - npostart
#  - netflix
#  - prime
#- Steam
#  - Civ 6
#- Lutris
agent: 1
args: -device ivshmem-plain,memdev=ivshmem,bus=pcie.0 -object memory-backend-file,id=ivshmem,share=on,mem-path=/dev/shm/looking-glass,size=128M
bios: ovmf
boot: order=scsi0;ide2
cores: 16
cpu: EPYC
efidisk0: vm1-pool:vm-408-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
hostpci0: 0000:0e:10.4,pcie=1
hostpci1: 0000:08:00.0,pcie=1
hostpci2: 0000:43:00,pcie=1,x-vga=1
ide2: none,media=cdrom
localtime: 0
machine: q35
memory: 16384
meta: creation-qemu=6.1.0,ctime=1650585676
name: jaminere
numa: 0
ostype: l26
parent: before_update
scsi0: vm1-pool:vm-408-disk-1,cache=writeback,discard=on,size=256G,ssd=1
scsihw: virtio-scsi-pci
serial0: socket
smbios1: uuid=069501ba-860a-47c2-8cab-c79183c4efc5
sockets: 1
unused0: vm1-pool:vm-408-disk-2
vga: none
vmgenid: ffbdb82a-a0d7-44ed-85f6-6bb6a3c989f3

