#Ubuntu 23.10 mantic minotaur.
#(desktop amd64)
#
#Hardware%3A
#* USB%3A 06%3A00.0
#* GPU%3A 12%3A00.x
#
#Software%3A
#* vim
#* net-tools
#* openssh-server
#* nvidia binary driver
#* looking-glass-host (works!)
#
#Settings%3A
#* serial console
#* OVMF & grub/linux boot @ 1080p
#* enable root login over ssh
#* added users hurenkam, ibrahimc & hurenkad
#* gdm3
#    * mirrored dual monitors @ 1080p
#    * looking-glass-host started before login
#    * looking-glass-host re-started after login
#
#cpu%3A x86-64-v2-AES
#vga%3A qxl,memory=64
agent: 1
args: -cpu EPYC,-hypervisor,+svm -spice port=5905,addr=0.0.0.0,disable-ticketing=on -device virtio-serial-pci -chardev spicevmc,id=vdagent,name=vdagent -device virtserialport,chardev=vdagent,name=com.redhat.spice.0 -device virtio-mouse -device virtio-keyboard -device ivshmem-plain,memdev=ivshmem12,bus=pcie.0 -object memory-backend-file,id=ivshmem12,share=on,mem-path=/dev/shm/lg12,size=32M
audio0: device=ich9-intel-hda,driver=spice
balloon: 0
bios: ovmf
boot: order=scsi0;ide2;net0
cores: 8
cpu: EPYC
efidisk0: vm1-pool:vm-502-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
hostpci0: 0000:06:00.0,pcie=1
hostpci1: 0000:12:00,pcie=1
hugepages: 1024
ide2: none,media=cdrom
machine: q35
memory: 8192
meta: creation-qemu=8.0.2,ctime=1694784027
name: malachor
net0: virtio=4A:0F:57:55:EC:55,bridge=vmbr0,firewall=1
numa: 1
ostype: l26
scsi0: vm1-pool:vm-502-disk-1,cache=writeback,discard=on,iothread=1,size=64G,ssd=1
scsihw: virtio-scsi-single
serial0: socket
smbios1: uuid=276b8aa5-2efd-4bb4-816a-81a2ac4a152e
sockets: 1
vga: none
vmgenid: a7eb2e77-2aa8-49f9-99f2-c92d2e606fd2
