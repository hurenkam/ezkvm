agent: 1
args: -device ivshmem-plain,memdev=ivshmem12,bus=pcie.0 -object memory-backend-file,id=ivshmem12,share=on,mem-path=/dev/shm/lg12,size=32M -device ivshmem-plain,memdev=ivshmem43,bus=pcie.0 -object memory-backend-file,id=ivshmem43,share=on,mem-path=/dev/shm/lg43,size=32M -device ivshmem-plain,memdev=ivshmem44,bus=pcie.0 -object memory-backend-file,id=ivshmem44,share=on,mem-path=/dev/shm/lg44,size=32M
