#Ubuntu Lunar Lobster (23.04)
#
#(upgraded from 22.04)
#
#
#ETH%3A 0e%3A10.4
#
#Multi-Seat configuration%3A
#- seat0%3A virtio
#- seat1%3A USB%3A 05%3A00.0 / GPU%3A 44%3A00.x
#- seat2%3A USB%3A 06%3A00.0 / GPU%3A 12%3A00.x
#- seat3%3A USB%3A 08%3A00.0 / GPU%3A 43%3A00.x
#
#NVidia proprietary driver 535
agent: 1
bios: ovmf
boot: order=scsi0;ide2
cores: 8
efidisk0: vm1-pool:vm-405-disk-1,efitype=4m,pre-enrolled-keys=1,size=4M
hostpci0: 0000:0e:10.4,pcie=1
hostpci1: 0000:05:00.0,pcie=1
hostpci2: 0000:44:00,pcie=1
hostpci3: 0000:06:00.0,pcie=1
hostpci4: 0000:12:00,pcie=1
hostpci5: 0000:08:00.0,pcie=1
hostpci6: 0000:43:00,pcie=1
hugepages: 1024
ide2: none,media=cdrom
machine: q35
memory: 8192
meta: creation-qemu=6.1.0,ctime=1650585676
name: lenahra
numa: 1
ostype: l26
parent: after_installing_nvidia_driver
scsi0: vm1-pool:vm-405-disk-0,cache=writeback,discard=on,size=256G,ssd=1
scsihw: virtio-scsi-pci
serial0: socket
smbios1: uuid=36962b4a-530a-473d-a6e5-a53c32a64177
sockets: 1
tpmstate0: vm1-pool:vm-405-disk-2,size=4M,version=v2.0
vga: virtio,memory=128
vmgenid: 794c4dac-a4a8-41ee-bf93-3e5bd82ba894

