agent: 1
args: -cpu EPYC,-hypervisor,+svm -spice port=5905,addr=0.0.0.0,disable-ticketing=on -device virtio-serial-pci -chardev spicevmc,id=vdagent,name=vdagent -device virtserialport,chardev=vdagent,name=com.redhat.spice.0 -device virtio-mouse -device virtio-keyboard -device ivshmem-plain,memdev=ivshmem,bus=pcie.0 -object memory-backend-file,id=ivshmem,share=on,mem-path=/dev/shm/looking-glass-woteba,size=128M
audio0: device=ich9-intel-hda,driver=spice
balloon: 0
bios: ovmf
boot: order=scsi0;ide2;net0
cores: 8
cpu: EPYC
efidisk0: vm1-pool:base-904-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
hostpci0: 0000:06:00.0,pcie=1
hostpci1: 0000:12:00,pcie=1
machine: q35
memory: 8192
meta: creation-qemu=8.0.2,ctime=1694160618
name: mandalore
net0: virtio=46:DA:27:A8:FD:D8,bridge=vmbr0,firewall=1
numa: 1
ostype: l26
scsi0: vm1-pool:base-904-disk-1,cache=writeback,discard=on,iothread=1,size=128G,ssd=1
scsihw: virtio-scsi-single
smbios1: uuid=4235884a-3445-4ea0-a991-20fe69f93c6e
sockets: 1
template: 1
vga: none
vmgenid: 4dfcbde8-6370-44d0-bcd9-0827faaa4c56
