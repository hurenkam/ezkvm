#Hardware%3A
#- USB%3A 07%3A00.0
#- GPU%3A 41%3A00.x (AMD RX 570)
#
#Software%3A
#- Big Sur (fresh install)
#
#Settings%3A
#- Added user Mark Hurenkamp
#
#Notes%3A
#- Boots from seperate OpenCore image (not integrated into main disk EFI)
#- No updated config.plist yet (Do not login to iCloud services!)
#- Hama BT Dongle is recognized, but does not seem to properly connect with devices
#- TP Link BT Dongle is not recognized.
agent: 1
args: -device isa-applesmc,osk="<OSK>" -smbios type=2 -device usb-kbd,bus=ehci.0,port=2 -cpu Haswell-noTSX,vendor=GenuineIntel,+invtsc,+hypervisor,kvm=on,vmware-cpuid-freq=on
balloon: 0
bios: ovmf
boot: order=ide2;ide0;virtio0;net0
cores: 8
cpu: Penryn
efidisk0: vm1-pool:vm-400-disk-0,efitype=4m,size=4M
hostpci0: 0000:07:00.0,pcie=1
hostpci1: 0000:41:00,pcie=1,rombar=1,romfile=vgabios-radeon-rx570.bin
hugepages: 1024
ide2: vm1-pool:vm-400-opencore,cache=unsafe,size=152M
machine: pc-q35-5.2
memory: 8192
meta: creation-qemu=8.0.2,ctime=1696016043
name: bigsur
net0: virtio=EE:B3:8D:40:14:7B,bridge=vmbr0,firewall=1
numa: 1
ostype: other
parent: fresh_install
scsihw: virtio-scsi-pci
smbios1: uuid=05cba597-8096-47c6-9cd7-1481dbb3b95a
sockets: 1
vga: none
virtio0: vm1-pool:vm-400-disk-1,cache=writeback,discard=on,size=1T
vmgenid: 7166b423-26e6-4937-866f-00e403a9fc9b

