#Manjaro 23.0 KDE
#
# * root login over ssh
# * added users%3A
#    * hurenkam
#    * hurenkad
#    * ibrahimc
# * installed nvidia proprietary driver (nouveau seemed to have problems with the GPU?)
# * installed looking-glass-host (needs manual start)
agent: 1
args: -cpu EPYC,-hypervisor,+svm -spice port=5904,addr=0.0.0.0,disable-ticketing=on -device virtio-serial-pci -chardev spicevmc,id=vdagent,name=vdagent -device virtserialport,chardev=vdagent,name=com.redhat.spice.0 -device virtio-mouse -device virtio-keyboard -device ivshmem-plain,memdev=ivshmem,bus=pcie.0 -object memory-backend-file,id=ivshmem,share=on,mem-path=/dev/shm/lg12,size=32M
audio0: device=ich9-intel-hda,driver=spice
balloon: 0
bios: ovmf
boot: order=scsi0;ide2;net0
cores: 8
cpu: EPYC
efidisk0: vm1-pool:vm-504-disk-0,efitype=4m,pre-enrolled-keys=1,size=4M
hostpci0: 0000:06:00.0,pcie=1
hostpci1: 0000:12:00,pcie=1
hostpci2: 0000:0e:10.2,pcie=1
hugepages: 1024
machine: q35
memory: 8192
meta: creation-qemu=8.0.2,ctime=1694160618
name: mandalore
net0: virtio=1A:E9:4F:BD:6D:6D,bridge=vmbr0,firewall=1
numa: 1
ostype: l26
scsi0: vm1-pool:vm-504-disk-1,cache=writeback,discard=on,iothread=1,size=128G,ssd=1
scsihw: virtio-scsi-single
serial0: socket
smbios1: uuid=fdc76824-8fa1-42c1-880f-1306014fd3aa
sockets: 1
vga: none
vmgenid: 3310e4e0-f8d7-4ca9-b349-72074403a2ae
