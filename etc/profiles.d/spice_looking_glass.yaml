devices:
  displays: []

input_devices:
  - type: "virtio-mouse"
  - type: "virtio-keyboard"

spice:
  enabled: true
  port: 5903
  addr: "0.0.0.0"
  disable_ticketing: true
  audio: true
  vdagent: true

ivshmem:
  enabled: true
  size: 128
  vectors: 1
  id: "ivshmem0"
  bus: "pcie.0"
  mem_path: "/dev/kvmfr0"

audio_devices:
  - type: "ich9-intel-hda"
    id: "audiodev0"
    bus: "pci.2"
    addr: "0xc"
  - type: "hda-micro"
    id: "audiodev0-codec0"
    bus: "audiodev0.0"
    cad: 0
    audiodev: "spice-backend0"
  - type: "hda-duplex"
    id: "audiodev0-codec1"
    bus: "audiodev0.0"
    cad: 1
    audiodev: "spice-backend0"
