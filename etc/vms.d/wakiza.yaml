# Windows 11 VM configuration split into reusable profiles.
# Use with: EZKVM_CONFIG=etc/ezkvm.yaml
name: "wakiza"
backend: "qemu"

profiles:
  - "proxmox-q35-uefi"
  - "windows-common"
  - "windows-11"
  - "looking-glass"
  - "gpu-passthrough"
  - "storage-virtio-scsi-pci"

system:
  memory: { size: 16384 }
  cpu: { model: "host", vcpus: 8 }
  boot: { uefi_vars: "/dev/vm1/vm-108-efidisk" }
  tpm: { state_path: "/var/run/qemu-server/108.swtpm", state_backend_uri: "file:///dev/vm1/vm-108-tpmstate" }
  smbios: { uuid: "04d064c3-66a1-4aa7-9589-f8b3ecf91cd7", vm_generation_id: "c13b46f3-9743-49f0-92e8-297b9feac497" }

devices:
  drives:
    - { interface: "scsi", type: "disk", path: "/dev/vm1/vm-108-boot", boot_index: 100 }
    - { interface: "scsi", type: "disk", path: "/dev/vm1/vm-108-tmp" }
    - { interface: "ide", type: "cdrom", boot_index: 101 }
  networks:
    - { backend: { type: "tap", ifname: "tap108i0" }, mac: "BC:24:11:3A:21:B7", boot_index: 102 }

options:
  guest_agent: { socket_path: "/var/run/qemu-server/108.qga" }
  qmp: { enabled: true, socket_path: "/var/run/qemu-server/108.qmp" }
  pid_file: "/tmp/ezkvm/wakiza.pid"
  log_dir: "/tmp/ezkvm/logs"
  log_keep: 5
